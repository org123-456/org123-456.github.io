<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 修复底部被挡住的关键：viewport-fit=cover -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ashveil Phone OS</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; 
        /* 使用 dvh 动态高度，解决底部输入框被挡住的问题 */
        height: 100dvh; width: 100vw; 
        background: #0d111a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: white; overflow: hidden;
    }
    
    .phone {
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        position: relative;
    }

    .status-bar {
        height: 40px; padding: 0 25px; display: flex;
        justify-content: space-between; align-items: center;
        font-size: 13px; color: #aaa; z-index: 10;
        background: rgba(13, 17, 26, 0.8); backdrop-filter: blur(10px);
        /* 适配刘海屏顶部 */
        padding-top: env(safe-area-inset-top);
    }

    .screen {
        flex: 1; display: none; flex-direction: column;
        overflow: hidden;
    }
    .screen.active { display: flex; }

    /* 桌面 */
    #home-screen {
        padding: 30px 20px;
        background: linear-gradient(180deg, #171b2b, #090b12);
    }
    .clock-widget { text-align: center; margin-bottom: 50px; }
    .clock-widget h1 { margin: 0; font-size: 56px; font-weight: 300; letter-spacing: 2px;}
    .clock-widget p { margin: 5px 0 0 0; color: #888; font-size: 14px; }
    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px; }
    .app-icon-wrapper { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .app-icon {
        width: 60px; height: 60px; border-radius: 18px;
        background: #252b40; display: flex; justify-content: center;
        align-items: center; font-size: 28px; margin-bottom: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .app-name { font-size: 12px; color: #ccc; }

    /* App 头部 */
    .app-header {
        height: 50px; display: flex; align-items: center; padding: 0 20px;
        background: rgba(24, 28, 43, 0.9); backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10;
    }
    .back-btn { font-size: 24px; margin-right: 15px; cursor: pointer; color: #fff; }
    .app-title { font-size: 16px; font-weight: bold; letter-spacing: 1px; }
    
    .app-content { flex: 1; overflow-y: auto; padding: 20px; position: relative; }

    /* ========================================== */
    /* 线上通讯 UI (图4风格：头像、多气泡、磨砂) */
    /* ========================================== */
    .chat-bg-online {
        background: linear-gradient(to bottom, #1a1e29, #252a3a);
    }
    .msg-row-online { display: flex; margin-bottom: 15px; align-items: flex-end; }
    .msg-row-online.me { flex-direction: row-reverse; }
    .avatar {
        width: 36px; height: 36px; border-radius: 50%;
        background: #4b405f; display: flex; align-items: center; justify-content: center;
        font-size: 18px; margin: 0 10px; flex-shrink: 0;
    }
    .bubble-online {
        max-width: 70%; padding: 10px 14px; border-radius: 18px;
        font-size: 15px; line-height: 1.4; 
        background: rgba(30, 35, 51, 0.8); backdrop-filter: blur(5px);
        color: #eee; cursor: pointer;
    }
    .msg-row-online.me .bubble-online { background: #e0e0e0; color: #111; }
    
    /* ========================================== */
    /* 线下沉浸 UI (图3风格：小说式排版、无气泡) */
    /* ========================================== */
    .chat-bg-offline {
        /* 模拟星空/深邃背景 */
        background: radial-gradient(circle at center, #111625 0%, #05060b 100%);
    }
    .msg-row-offline { margin-bottom: 25px; }
    .novel-text {
        font-size: 15px; line-height: 2.0; color: #d4d8e5;
        text-indent: 2em; letter-spacing: 0.5px;
        cursor: pointer;
    }
    .novel-me {
        font-size: 14px; color: #8bd17c; text-align: right;
        font-style: italic; opacity: 0.8;
    }

    /* 消息操作菜单 */
    .msg-menu { display: none; gap: 15px; margin-top: 8px; font-size: 12px; font-weight: bold; justify-content: flex-end; }
    .msg-menu span { cursor: pointer; padding: 4px 8px; border-radius: 4px; background: rgba(255,255,255,0.1); }

    /* 输入框区域 (适配底部安全区) */
    .chat-input-area {
        display: flex; padding: 12px 15px; background: rgba(24, 28, 43, 0.95);
        border-top: 1px solid rgba(255,255,255,0.05);
        /* 关键：给底部留出小白条的空间 */
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }
    .chat-input-area input {
        flex: 1; height: 40px; border-radius: 20px; border: none;
        background: rgba(255,255,255,0.1); color: white; padding: 0 15px; outline: none; font-size: 15px;
    }
    .chat-input-area button {
        margin-left: 10px; width: 60px; border-radius: 20px; border: none;
        background: #fff; color: #000; font-weight: bold; cursor: pointer;
    }

    .card { background: #1e2333; border-radius: 12px; padding: 16px; margin-bottom: 15px; }
    .card h3 { margin: 0 0 10px 0; color: #d8c2ff; font-size: 16px; }
</style>
</head>
<body>

<div class="phone">
    <div class="status-bar">
        <span id="status-time">00:00</span>
        <span>◉ WiFi 🔋</span>
    </div>

    <div id="home-screen" class="screen active">
        <div class="clock-widget">
            <h1 id="widget-time">00:00</h1>
            <p>鸽川区 · 侦探终端</p>
        </div>
        <div class="app-grid" id="app-grid"></div>
    </div>

    <div id="app-screen" class="screen">
        <div class="app-header">
            <div class="back-btn" onclick="PhoneEngine.closeApp()">←</div>
            <div class="app-title" id="app-title">App Name</div>
        </div>
        <div class="app-content" id="app-content"></div>
    </div>
</div>

<script>
// ==========================================
// 1. 本地数据库
// ==========================================
let localData = JSON.parse(localStorage.getItem('ashveil_db')) || {};
let DB = {
    global_chat: localData.global_chat || [],
    worldbook: localData.worldbook || []
};
DB.global_chat.forEach(m => { if (!m.id) m.id = 'msg_' + Date.now() + '_' + Math.floor(Math.random()*1000); });
function saveDB() { localStorage.setItem('ashveil_db', JSON.stringify(DB)); }

// ==========================================
// 2. AI 核心请求逻辑 (双形态 Prompt)
// ==========================================
async function fetchAIResponse(historyMessages, scene) {
    let apiKey = localStorage.getItem('api_key');
    let baseUrl = localStorage.getItem('api_url') || 'https://api.openai.com/v1';
    let modelName = localStorage.getItem('api_model') || 'gpt-3.5-turbo';
    let basePrompt = localStorage.getItem('api_system_prompt') || '你正在扮演《崩坏：星穹铁道》同人角色「不死途」。';
    let useWorldbook = localStorage.getItem('api_use_worldbook') === 'true';
    let targetWords = localStorage.getItem('api_target_words') || '300'; // 线下目标字数

    if(!apiKey) throw new Error("API_KEY_MISSING");

    let endpoint = baseUrl;
    if (!endpoint.endsWith('/chat/completions')) endpoint = endpoint.replace(/\/$/, '') + '/chat/completions';

    let finalSystemPrompt = basePrompt;
    
    // 【核心改动：双形态指令】
    if (scene === 'online_chat') {
        finalSystemPrompt += `\n\n【绝对指令：当前是手机线上聊天。
1. 你必须连续发送多条短消息，每条消息之间用 ||| 隔开。
2. 绝对不要使用句号、问号、叹号等结尾标点符号。
3. 保持高冷、简短，不要包含任何动作描写。】`;
    } else if (scene === 'offline_chat') {
        finalSystemPrompt += `\n\n【绝对指令：当前是面对面沉浸式互动。
1. 请输出一篇大约 ${targetWords} 字的小说式描写。
2. 包含细腻的神态、动作、心理描写，以及对话。
3. 不要使用星号包裹动作，直接像写小说一样写出优美的段落。】`;
    }

    if (useWorldbook && DB.worldbook.length > 0) {
        finalSystemPrompt += "\n\n【世界观参考资料】：\n";
        DB.worldbook.forEach(item => { finalSystemPrompt += `- ${item.title}: ${item.content}\n`; });
    }

    let messages = [{ role: "system", content: finalSystemPrompt }, ...historyMessages];

    const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify({ model: modelName, messages: messages, temperature: 0.7 })
    });

    const data = await response.json();
    if(data.choices && data.choices[0]) {
        return data.choices[0].message.content.trim();
    } else {
        throw new Error("API_RESPONSE_ERROR");
    }
}

// ==========================================
// 3. 消息操作
// ==========================================
window.handleChatSend = async function(appId) {
    let input = document.getElementById(`chat-input-${appId}`);
    let text = input.value.trim();
    if(!text) return;
    if(!localStorage.getItem('api_key')) return alert("请先在【设置】中填写 API Key！");

    DB.global_chat.push({ id: 'msg_'+Date.now(), type: 'me', scene: appId, text: text });
    input.value = '';
    saveDB();
    PhoneEngine.refreshCurrentApp();

    let typingId = 'msg_typing';
    DB.global_chat.push({ id: typingId, type: 'other', scene: appId, text: '正在输入...', isTyping: true });
    PhoneEngine.refreshCurrentApp();

    let recentChats = DB.global_chat.filter(m => !m.isTyping).slice(-15);
    let historyMessages = recentChats.map(m => ({ role: m.type === 'me' ? 'user' : 'assistant', content: m.text }));

    try {
        let reply = await fetchAIResponse(historyMessages, appId);
        DB.global_chat = DB.global_chat.filter(m => m.id !== typingId);
        
        // 【核心改动：线上连发多条气泡切分】
        if (appId === 'online_chat') {
            // 按 ||| 或者换行符切分，并去除结尾标点
            let parts = reply.split(/\|\|\||\n/).map(p => p.trim().replace(/[。！？！？]$/, '')).filter(p => p);
            parts.forEach((p, index) => {
                DB.global_chat.push({ id: 'msg_'+Date.now()+'_'+index, type: 'other', scene: appId, text: p });
            });
        } else {
            DB.global_chat.push({ id: 'msg_'+Date.now(), type: 'other', scene: appId, text: reply });
        }
    } catch (error) {
        DB.global_chat = DB.global_chat.filter(m => m.id !== typingId);
        DB.global_chat.push({ id: 'msg_'+Date.now(), type: 'other', scene: appId, text: '【终端离线】' });
    }

    saveDB();
    PhoneEngine.refreshCurrentApp();
}

window.toggleMsgMenu = function(msgId) {
    let menu = document.getElementById(`menu-${msgId}`);
    if (menu.style.display === 'none' || menu.style.display === '') {
        document.querySelectorAll('.msg-menu').forEach(el => el.style.display = 'none');
        menu.style.display = 'flex';
    } else { menu.style.display = 'none'; }
}
window.editMsg = function(msgId) {
    let msg = DB.global_chat.find(m => m.id === msgId);
    let newText = prompt("修改内容：", msg.text);
    if(newText !== null && newText.trim() !== "") {
        msg.text = newText.trim(); saveDB(); PhoneEngine.refreshCurrentApp();
    }
}
window.delMsg = function(msgId) {
    if(confirm("删除这条消息？")) {
        DB.global_chat = DB.global_chat.filter(m => m.id !== msgId);
        saveDB(); PhoneEngine.refreshCurrentApp();
    }
}
window.regenMsg = async function(msgId, appId) {
    let index = DB.global_chat.findIndex(m => m.id === msgId);
    if(index === -1) return;
    let historySlice = DB.global_chat.slice(Math.max(0, index - 15), index);
    let historyMessages = historySlice.map(m => ({ role: m.type === 'me' ? 'user' : 'assistant', content: m.text }));

    DB.global_chat[index].text = '重新生成中...';
    PhoneEngine.refreshCurrentApp();

    try {
        let reply = await fetchAIResponse(historyMessages, appId);
        DB.global_chat[index].text = reply;
    } catch (error) { DB.global_chat[index].text = '【生成失败】'; }
    saveDB(); PhoneEngine.refreshCurrentApp();
}

// ==========================================
// 4. UI 渲染引擎 (双形态 UI)
// ==========================================
const PHONE_APPS = {
    online_chat: {
        id: 'online_chat', name: '线上通讯', icon: '💬',
        render: function(container) { renderOnlineUI(container); }
    },
    offline_chat: {
        id: 'offline_chat', name: '面对面', icon: '☕',
        render: function(container) { renderOfflineUI(container); }
    },
    worldbook: {
        id: 'worldbook', name: '世界书', icon: '📖',
        render: function(container) { /* 省略，和之前一样，为了代码长度精简，你可以用之前的逻辑 */
            container.innerHTML = `<div class="card"><p style="color:#aaa;">世界书管理已在底层运行，可前往设置开启。</p></div>`;
        }
    },
    settings: {
        id: 'settings', name: '设置', icon: '⚙️',
        render: function(container) {
            let savedUrl = localStorage.getItem('api_url') || '';
            let savedKey = localStorage.getItem('api_key') || '';
            let savedModel = localStorage.getItem('api_model') || '';
            let savedPrompt = localStorage.getItem('api_system_prompt') || '你正在扮演《崩坏：星穹铁道》同人角色「不死途」。';
            let savedWords = localStorage.getItem('api_target_words') || '300';

            container.innerHTML = `
            <div class="card">
                <h3 style="color:#ff9e9e;">角色灵魂设定 (Prompt)</h3>
                <textarea id="api-prompt-input" style="width:100%; height:120px; padding:10px; border-radius:8px; border:none; background:#121522; color:white; font-size:12px; margin-bottom:10px;">${savedPrompt}</textarea>
            </div>
            <div class="card">
                <h3>API 连接配置</h3>
                <input type="text" id="api-url-input" value="${savedUrl}" placeholder="接口地址 (Base URL)" style="width:100%; padding:10px; border-radius:8px; border:none; background:#121522; color:white; margin-bottom:10px;">
                <input type="password" id="api-key-input" value="${savedKey}" placeholder="API Key" style="width:100%; padding:10px; border-radius:8px; border:none; background:#121522; color:white; margin-bottom:10px;">
                <input type="text" id="api-model-input" value="${savedModel}" placeholder="模型名称" style="width:100%; padding:10px; border-radius:8px; border:none; background:#121522; color:white; margin-bottom:10px;">
                
                <p style="margin:10px 0 5px 0; font-size:12px; color:#8bd17c;">线下沉浸模式目标字数</p>
                <input type="number" id="api-words-input" value="${savedWords}" placeholder="例如: 300" style="width:100%; padding:10px; border-radius:8px; border:none; background:#121522; color:white;">
                
                <button onclick="saveSettings()" style="width:100%; margin-top:15px; padding:10px; border-radius:8px; border:none; background:#fff; color:#000; cursor:pointer; font-weight:bold;">保存所有配置</button>
                <button onclick="clearChat()" style="width:100%; margin-top:10px; padding:10px; border-radius:8px; border:none; background:#ff6b6b; color:#fff; cursor:pointer; font-weight:bold;">清空所有记忆</button>
            </div>`;
        }
    }
};

window.saveSettings = function() {
    localStorage.setItem('api_url', document.getElementById('api-url-input').value.trim());
    localStorage.setItem('api_key', document.getElementById('api-key-input').value.trim());
    localStorage.setItem('api_model', document.getElementById('api-model-input').value.trim());
    localStorage.setItem('api_system_prompt', document.getElementById('api-prompt-input').value.trim());
    localStorage.setItem('api_target_words', document.getElementById('api-words-input').value.trim());
    alert('配置已更新！');
};
window.clearChat = function() {
    if(confirm('警告：清空所有聊天记忆？')) { DB.global_chat = []; saveDB(); PhoneEngine.refreshCurrentApp(); }
}

// 渲染线上通讯 (头像+多气泡)
function renderOnlineUI(container) {
    let chatHTML = `<div id="chat-list-online_chat" class="chat-bg-online" style="flex:1; overflow-y:auto; padding:20px; margin:-20px; margin-bottom:0;">`;
    let sceneMessages = DB.global_chat.filter(m => m.scene === 'online_chat');
    
    sceneMessages.forEach(msg => {
        let menuAlign = msg.type === 'me' ? 'justify-content: flex-end; padding-right:50px;' : 'justify-content: flex-start; padding-left:50px;';
        let avatar = msg.type === 'me' ? '<div class="avatar" style="background:#fff; color:#000;">我</div>' : '<div class="avatar">🎩</div>';
        
        chatHTML += `
        <div class="msg-row-online ${msg.type}">
            ${msg.type === 'other' ? avatar : ''}
            <div class="bubble-online" onclick="toggleMsgMenu('${msg.id}')">${msg.text}</div>
            ${msg.type === 'me' ? avatar : ''}
        </div>
        <div class="msg-menu" id="menu-${msg.id}" style="${menuAlign}">
            <span onclick="editMsg('${msg.id}')">✏️编辑</span>
            <span onclick="delMsg('${msg.id}')" style="color:#ff6b6b;">🗑️删除</span>
        </div>`;
    });
    chatHTML += `</div>`;

    let inputHTML = `
    <div class="chat-input-area" style="position:sticky; bottom:0; left:0; right:0; margin: 0 -20px -20px -20px;">
        <input type="text" id="chat-input-online_chat" placeholder="Type a message..." onkeypress="if(event.keyCode==13) handleChatSend('online_chat')">
        <button onclick="handleChatSend('online_chat')">↑</button>
    </div>`;

    container.innerHTML = `<div style="display:flex; flex-direction:column; height:100%; position:relative;">${chatHTML}${inputHTML}</div>`;
    let list = document.getElementById(`chat-list-online_chat`);
    list.scrollTop = list.scrollHeight;
}

// 渲染线下沉浸 (小说排版)
function renderOfflineUI(container) {
    let chatHTML = `<div id="chat-list-offline_chat" class="chat-bg-offline" style="flex:1; overflow-y:auto; padding:20px; margin:-20px; margin-bottom:0;">`;
    let sceneMessages = DB.global_chat.filter(m => m.scene === 'offline_chat');
    
    sceneMessages.forEach(msg => {
        if(msg.type === 'me') {
            chatHTML += `<div class="msg-row-offline"><div class="novel-me" onclick="toggleMsgMenu('${msg.id}')">“${msg.text}”</div></div>`;
        } else {
            // 将换行符转换为段落
            let paragraphs = msg.text.split('\n').filter(p => p.trim() !== '');
            chatHTML += `<div class="msg-row-offline" onclick="toggleMsgMenu('${msg.id}')">`;
            paragraphs.forEach(p => { chatHTML += `<div class="novel-text">${p}</div>`; });
            chatHTML += `</div>`;
        }
        chatHTML += `
        <div class="msg-menu" id="menu-${msg.id}">
            <span onclick="editMsg('${msg.id}')">✏️修改</span>
            <span onclick="delMsg('${msg.id}')" style="color:#ff6b6b;">🗑️删除</span>
            ${msg.type === 'other' && !msg.isTyping ? `<span onclick="regenMsg('${msg.id}', 'offline_chat')" style="color:#8bd17c;">🔄重写</span>` : ''}
        </div>`;
    });
    chatHTML += `</div>`;

    let inputHTML = `
    <div class="chat-input-area" style="position:sticky; bottom:0; left:0; right:0; margin: 0 -20px -20px -20px; background:rgba(5,6,11,0.95);">
        <input type="text" id="chat-input-offline_chat" placeholder="你的回应..." onkeypress="if(event.keyCode==13) handleChatSend('offline_chat')">
        <button onclick="handleChatSend('offline_chat')">发送</button>
    </div>`;

    container.innerHTML = `<div style="display:flex; flex-direction:column; height:100%; position:relative;">${chatHTML}${inputHTML}</div>`;
    let list = document.getElementById(`chat-list-offline_chat`);
    list.scrollTop = list.scrollHeight;
}

// ==========================================
// 5. 手机公共引擎
// ==========================================
const PhoneEngine = {
    currentAppId: null,
    init: function() {
        this.updateTime(); setInterval(() => this.updateTime(), 1000); this.renderDesktop();
    },
    renderDesktop: function() {
        const grid = document.getElementById('app-grid'); grid.innerHTML = '';
        for (let key in PHONE_APPS) {
            let app = PHONE_APPS[key];
            grid.innerHTML += `<div class="app-icon-wrapper" onclick="PhoneEngine.openApp('${app.id}')"><div class="app-icon">${app.icon}</div><div class="app-name">${app.name}</div></div>`;
        }
    },
    openApp: function(appId) {
        this.currentAppId = appId;
        document.getElementById('app-title').innerText = PHONE_APPS[appId].name;
        PHONE_APPS[appId].render(document.getElementById('app-content'));
        document.getElementById('home-screen').classList.remove('active');
        document.getElementById('app-screen').classList.add('active');
    },
    closeApp: function() {
        this.currentAppId = null;
        document.getElementById('app-screen').classList.remove('active');
        document.getElementById('home-screen').classList.add('active');
    },
    refreshCurrentApp: function() {
        if (this.currentAppId) PHONE_APPS[this.currentAppId].render(document.getElementById('app-content'));
    },
    updateTime: function() {
        let d = new Date();
        let timeStr = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
        document.getElementById("status-time").innerText = timeStr;
        document.getElementById("widget-time").innerText = timeStr;
    }
};
window.onload = () => { PhoneEngine.init(); };
</script>
</body>
</html>
