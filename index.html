<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>不死途 · Ashveil</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#08090d;
    color:#eee;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


.app{
    max-width:500px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:#0d1018;
}


/* 顶部 */

.header{

    height:70px;
    display:flex;
    align-items:center;
    padding:12px 18px;

    background:#121621;
    border-bottom:1px solid #252a38;

}


.avatar{

    width:46px;
    height:46px;

    border-radius:50%;

    background:
    linear-gradient(
    135deg,
    #d9d2ff,
    #5d547c
    );

    margin-right:12px;

}


.info h2{

    margin:0;

    font-size:18px;

}


.info span{

    font-size:12px;

    color:#8bd17c;

}



/* 聊天区域 */


.chat{

    flex:1;

    overflow-y:auto;

    padding:20px;

}



/* 气泡 */

.row{

    display:flex;

    margin-bottom:15px;

}


.row.me{

    justify-content:flex-end;

}


.bubble{

    max-width:75%;

    padding:12px 16px;

    border-radius:18px;

    line-height:1.5;

    font-size:15px;

}


.other .bubble{

    background:#222838;

    border-top-left-radius:5px;

}


.me .bubble{

    background:#65548f;

    border-top-right-radius:5px;

}



/* 底部 */


.input-area{

    display:flex;

    padding:12px;

    background:#121621;

    border-top:1px solid #252a38;

}


input{

    flex:1;

    background:#202532;

    border:none;

    outline:none;

    color:white;

    padding:12px;

    border-radius:20px;

    font-size:15px;

}


button{

    margin-left:10px;

    width:55px;

    border:none;

    border-radius:20px;

    background:#cbb7ff;

    color:#17121f;

}



</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="avatar"></div>


<div class="info">

<h2>不死途</h2>

<span>● 在线</span>

</div>


</div>



<div class="chat" id="chat">


<div class="row other">

<div class="bubble">

来了？

<br>

今天怎么样。

</div>

</div>


</div>



<div class="input-area">


<input 
id="input"
placeholder="输入消息……"
>


<button onclick="send()">
发
</button>


</div>


</div>


<script>


let chat = document.getElementById("chat");
let input = document.getElementById("input");


// 不死途初始回复库

let replies = [

"嗯？来了。今天怎么样？",

"看起来你有话想说。坐吧，我听着。",

"事务所今天还算安静，暂时没有什么东西追着我跑。算是好消息。",

"我在。慢慢说，不用急。",

"让我猜猜……你不是单纯来问好的。发生什么了？"

];



// 发送消息

function send(){


let text=input.value.trim();


if(text===""){
return;
}



// 用户消息

addMessage(
text,
"me"
);



input.value="";



// 模拟思考时间

let wait=document.createElement("div");

wait.className="row other";

wait.innerHTML=
`
<div class="bubble">
……
</div>
`;

chat.appendChild(wait);

chat.scrollTop=chat.scrollHeight;



setTimeout(()=>{


chat.removeChild(wait);



let reply=getReply(text);



addMessage(
reply,
"other"
);



save();


},1000);



}



// 添加聊天气泡

function addMessage(text,type){


let row=document.createElement("div");

row.className="row "+type;


row.innerHTML=
`
<div class="bubble">
${text}
</div>
`;



chat.appendChild(row);


chat.scrollTop=chat.scrollHeight;


}



// 简单回复逻辑

function getReply(text){


if(
text.includes("你好") ||
text.includes("在吗")
){

return "在。怎么，终于想起来找我了？";


}


if(
text.includes("累") ||
text.includes("烦") ||
text.includes("难过")
){

return "嗯……听起来今天不太顺。先坐一会儿，告诉我发生什么了。";


}



if(
text.includes("想你") ||
text.includes("想我")
){

return "想我了？这症状听起来不轻。不过……我暂时没有开治疗思念的药。";


}



if(
text.includes("案件") ||
text.includes("调查")
){

return "好，案件模式启动。把你知道的线索告诉我，别漏掉细节。";


}



return replies[
Math.floor(
Math.random()*replies.length
)
];


}



// 保存聊天

function save(){


localStorage.setItem(
"ashveil_chat",
chat.innerHTML
);


}



// 读取聊天

window.onload=function(){


let old=
localStorage.getItem(
"ashveil_chat"
);


if(old){

chat.innerHTML=old;

}


}




// 回车发送

input.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

send();

}

});



</script>


</body>

</html>
