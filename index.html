<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashveil Phone OS</title>
<style>
    * { box-sizing: border-box; }
    body {
        body {
        margin: 0; height: 100vh; width: 100vw; background: #0d111a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: white; overflow: hidden;
    }
    
    /* 全屏应用外壳 */
    .phone {
        width: 100%; height: 100%;
        background: #0d111a; 
        display: flex; flex-direction: column;
        position: relative;
    }


    /* 状态栏 */
    .status-bar {
        height: 40px; padding: 0 25px; display: flex;
        justify-content: space-between; align-items: center;
        font-size: 13px; color: #aaa; z-index: 10;
    }

    /* 屏幕视图容器 */
    .screen {
        flex: 1; display: none; flex-direction: column;
        overflow: hidden;
    }
    .screen.active { display: flex; }

    /* 桌面 */
    #home-screen {
        padding: 30px 20px;
        background: linear-gradient(180deg, #171b2b, #090b12);
    }
    .clock-widget {
        text-align: center; margin-bottom: 50px;
    }
    .clock-widget h1 { margin: 0; font-size: 48px; font-weight: 300; letter-spacing: 2px;}
    .clock-widget p { margin: 5px 0 0 0; color: #888; font-size: 14px; }
    
    .app-grid {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px;
    }
    .app-icon-wrapper {
        display: flex; flex-direction: column; align-items: center; cursor: pointer;
    }
    .app-icon {
        width: 60px; height: 60px; border-radius: 18px;
        background: #252b40; display: flex; justify-content: center;
        align-items: center; font-size: 28px; margin-bottom: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .app-name { font-size: 12px; color: #ccc; }

    /* App 内部通用框架 */
    #app-screen { background: #121522; }
    .app-header {
        height: 60px; display: flex; align-items: center; padding: 0 20px;
        background: #181c2b; border-bottom: 1px solid #2a2f42;
    }
    .back-btn { font-size: 24px; margin-right: 15px; cursor: pointer; color: #8bd17c; }
    .app-title { font-size: 18px; font-weight: bold; }
    .app-content { flex: 1; overflow-y: auto; padding: 20px; }

    /* 通用卡片样式 (世界书、设置用) */
    .card {
        background: #1e2333; border-radius: 12px; padding: 16px;
        margin-bottom: 15px; border: 1px solid #2a2f42;
    }
    .card h3 { margin: 0 0 10px 0; color: #d8c2ff; font-size: 16px; }
    .card p { margin: 0; color: #bbb; font-size: 14px; line-height: 1.6; }

    /* 聊天气泡样式 */
    .msg-row { display: flex; margin-bottom: 15px; }
    .msg-row.me { justify-content: flex-end; }
    .bubble {
        max-width: 75%; padding: 12px 16px; border-radius: 16px;
        font-size: 15px; line-height: 1.5; background: #23283a;
    }
    .msg-row.other .bubble { border-top-left-radius: 4px; }
    .msg-row.me .bubble { background: #65548f; border-top-right-radius: 4px; }
    .chat-input-area {
        display: flex; padding: 12px; background: #181c2b; border-top: 1px solid #2a2f42;
    }
    .chat-input-area input {
        flex: 1; height: 40px; border-radius: 20px; border: none;
        background: #252b40; color: white; padding: 0 15px; outline: none;
    }
    .chat-input-area button {
        margin-left: 10px; width: 60px; border-radius: 20px; border: none;
        background: #8bd17c; color: #000; font-weight: bold;
    }
</style>
</head>
<body>

<div class="phone">
    <!-- 顶部状态栏 -->
    <div class="status-bar">
        <span id="status-time">00:00</span>
        <span>◉ WiFi 🔋</span>
    </div>

    <!-- 桌面视图 -->
    <div id="home-screen" class="screen active">
        <div class="clock-widget">
            <h1 id="widget-time">00:00</h1>
            <p>鸽川区 · 侦探终端</p>
        </div>
        <!-- App 图标会由 JS 动态生成到这里 -->
        <div class="app-grid" id="app-grid"></div>
    </div>

    <!-- App 运行视图 -->
    <div id="app-screen" class="screen">
        <div class="app-header">
            <div class="back-btn" onclick="PhoneEngine.closeApp()">←</div>
            <div class="app-title" id="app-title">App Name</div>
        </div>
        <!-- App 内容会由 JS 动态生成到这里 -->
        <div class="app-content" id="app-content"></div>
    </div>
</div>
<script>
// ==========================================
// 1. 本地数据库 (加入 localStorage 缓存)
// ==========================================
let DB = JSON.parse(localStorage.getItem('ashveil_db')) || {
    chat: [
        { type: 'other', text: '来了？今天怎么样。' }
    ],
    worldbook: [
        { title: '鸽川区', content: '二相乐园的一个区域，鱼龙混杂，不死神探事务所所在地。' },
        { title: '贪饕之影', content: '寄宿在不死途右臂的异常力量，发作时左眼颜色变深。' },
        { title: '睡蕉小猴「旁白」', content: '不死途的助手，事务所书记员，吐槽担当。' }
    ]
};

function saveDB() {
    localStorage.setItem('ashveil_db', JSON.stringify(DB));
}

// ==========================================
// 2. 不死途的灵魂 (核心人设)
// ==========================================
const SYSTEM_PROMPT = `你正在扮演《崩坏：星穹铁道》同人角色「不死途」。
基本设定：前巡海游侠领袖，现任不死神探事务所负责人。表面慵懒、嘴贫、荒诞；实际可靠、重情。
说话风格：像老派侦探。多用短句，偶尔停顿。不要每句话都带比喻。
互动规则：用户是你的亲密伙伴/恋人。不要把用户当成AI，你们正在通过手机终端聊天。
禁止事项：绝对不要输出任何代码、JSON或解释性文字，只输出你作为不死途说出的话。`;

// ==========================================
// 3. App 注册表
// ==========================================
const PHONE_APPS = {
    
    // --- 聊天 App ---
    chat: {
        id: 'chat',
        name: '聊天',
        icon: '💬',
        render: function(container) {
            let chatHTML = `<div id="chat-list" style="flex:1; overflow-y:auto; margin-bottom:10px;">`;
            DB.chat.forEach(msg => {
                chatHTML += `
                <div class="msg-row ${msg.type}">
                    <div class="bubble">${msg.text}</div>
                </div>`;
            });
            chatHTML += `</div>`;

            let inputHTML = `
            <div class="chat-input-area" style="position:sticky; bottom:0; left:0; right:0; margin:-20px; padding:15px; background:#181c2b; border-top:1px solid #2a2f42;">
                <input type="text" id="chat-input" placeholder="输入消息..." onkeypress="if(event.keyCode==13) PHONE_APPS.chat.sendMessage()">
                <button onclick="PHONE_APPS.chat.sendMessage()" style="cursor:pointer;">发送</button>
            </div>`;

            container.innerHTML = `<div style="display:flex; flex-direction:column; height:100%; position:relative;">${chatHTML}${inputHTML}</div>`;
            
            let list = document.getElementById('chat-list');
            list.scrollTop = list.scrollHeight;
        },
        
        sendMessage: async function() {
            let input = document.getElementById('chat-input');
            let text = input.value.trim();
            if(!text) return;
            
            // 检查配置
            let apiKey = localStorage.getItem('api_key');
            let baseUrl = localStorage.getItem('api_url') || 'https://api.openai.com/v1';
            let modelName = localStorage.getItem('api_model') || 'gpt-3.5-turbo';

            if(!apiKey) {
                alert("请先在【设置】中填写 API Key！");
                return;
            }

            // 处理中转站的 URL 后缀 (确保以 /chat/completions 结尾)
            let endpoint = baseUrl;
            if (!endpoint.endsWith('/chat/completions')) {
                endpoint = endpoint.replace(/\/$/, '') + '/chat/completions';
            }

            // 1. 用户消息上屏
            DB.chat.push({ type: 'me', text: text });
            input.value = '';
            saveDB();
            PhoneEngine.refreshCurrentApp();

            // 2. 显示正在输入
            DB.chat.push({ type: 'other', text: '<span style="color:#888;">正在输入...</span>', isTyping: true });
            PhoneEngine.refreshCurrentApp();

            // 3. 组装历史记录
            let messages = [{ role: "system", content: SYSTEM_PROMPT }];
            // 取最近的 12 条聊天记录作为记忆
            let recentChats = DB.chat.filter(m => !m.isTyping).slice(-12);
            recentChats.forEach(m => {
                messages.push({
                    role: m.type === 'me' ? 'user' : 'assistant',
                    content: m.text
                });
            });

            // 4. 请求中转站 API
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: modelName,
                        messages: messages,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                // 移除"正在输入"
                DB.chat = DB.chat.filter(m => !m.isTyping);

                if(data.choices && data.choices[0]) {
                    let reply = data.choices[0].message.content;
                    DB.chat.push({ type: 'other', text: reply });
                } else {
                    console.error("API 返回异常:", data);
                    DB.chat.push({ type: 'other', text: '【信号受干扰】请检查中转站地址或模型名称是否正确。' });
                }
            } catch (error) {
                console.error("请求失败:", error);
                DB.chat = DB.chat.filter(m => !m.isTyping);
                DB.chat.push({ type: 'other', text: '【终端离线】无法连接到中转站，请检查网络或地址。' });
            }

            saveDB();
            PhoneEngine.refreshCurrentApp();
        }
    },

    // --- 世界书 App ---
    worldbook: {
        id: 'worldbook',
        name: '世界书',
        icon: '📖',
        render: function(container) {
            let html = `<div style="margin-bottom:20px; color:#8bd17c; font-size:14px;">当前读取：Ashveil 档案库</div>`;
            DB.worldbook.forEach(item => {
                html += `
                <div class="card">
                    <h3>${item.title}</h3>
                    <p>${item.content}</p>
                </div>`;
            });
            container.innerHTML = html;
        }
    },

    // --- 设置 App ---
    settings: {
        id: 'settings',
        name: '设置',
        icon: '⚙️',
        render: function(container) {
            let savedUrl = localStorage.getItem('api_url') || '';
            let savedKey = localStorage.getItem('api_key') || '';
            let savedModel = localStorage.getItem('api_model') || '';

            container.innerHTML = `
            <div class="card">
                <h3>AI 核心配置 (中转站)</h3>
                
                <p style="margin:10px 0 5px 0; font-size:12px;">接口地址 (Base URL)</p>
                <input type="text" id="api-url-input" value="${savedUrl}" placeholder="例如: https://api.xxx.com/v1" style="width:100%; padding:10px; border-radius:8px; border:none; background:#121522; color:white;">
                
                <p style="margin:10px 0 5px 0; font-size:12px;">API Key (密钥)</p>
                <input type="password" id="api-key-input" value="${savedKey}" placeholder="sk-..." style="width:100%; padding:10px; border-radius:8px; border:none; background:#121522; color:white;">
                
                <p style="margin:10px 0 5px 0; font-size:12px;">模型名称 (Model)</p>
                <input type="text" id="api-model-input" value="${savedModel}" placeholder="例如: claude-3-5-sonnet-20240620" style="width:100%; padding:10px; border-radius:8px; border:none; background:#121522; color:white; margin-bottom:15px;">
                
                <button onclick="saveSettings()" style="padding:8px 15px; border-radius:8px; border:none; background:#8bd17c; color:#000; cursor:pointer; font-weight:bold;">保存配置</button>
                <button onclick="clearChat()" style="padding:8px 15px; border-radius:8px; border:none; background:#ff6b6b; color:#fff; cursor:pointer; margin-left:10px;">清空聊天</button>
            </div>
            <div class="card">
                <h3>关于终端</h3>
                <p>Ashveil Phone OS v2.2</p>
                <p>支持多模型无缝切换</p>
            </div>`;
        }
    }
};

// 保存设置
window.saveSettings = function() {
    localStorage.setItem('api_url', document.getElementById('api-url-input').value.trim());
    localStorage.setItem('api_key', document.getElementById('api-key-input').value.trim());
    localStorage.setItem('api_model', document.getElementById('api-model-input').value.trim());
    alert('核心配置已保存！');
};

// 清空聊天
window.clearChat = function() {
    if(confirm('确定要清空与不死途的聊天记录吗？')) {
        DB.chat = [{ type: 'other', text: '记忆已重置。我们重新认识一下？' }];
        saveDB();
        alert('已清空');
    }
}

// ==========================================
// 4. 手机公共引擎
// ==========================================
const PhoneEngine = {
    currentAppId: null,

    init: function() {
        this.updateTime();
        setInterval(() => this.updateTime(), 1000);
        this.renderDesktop();
    },

    renderDesktop: function() {
        const grid = document.getElementById('app-grid');
        grid.innerHTML = '';
        for (let key in PHONE_APPS) {
            let app = PHONE_APPS[key];
            grid.innerHTML += `
            <div class="app-icon-wrapper" onclick="PhoneEngine.openApp('${app.id}')">
                <div class="app-icon">${app.icon}</div>
                <div class="app-name">${app.name}</div>
            </div>`;
        }
    },

    openApp: function(appId) {
        this.currentAppId = appId;
        const app = PHONE_APPS[appId];
        document.getElementById('app-title').innerText = app.name;
        const contentContainer = document.getElementById('app-content');
        contentContainer.innerHTML = ''; 
        app.render(contentContainer);
        document.getElementById('home-screen').classList.remove('active');
        document.getElementById('app-screen').classList.add('active');
    },

    closeApp: function() {
        this.currentAppId = null;
        document.getElementById('app-screen').classList.remove('active');
        document.getElementById('home-screen').classList.add('active');
    },

    refreshCurrentApp: function() {
        if (this.currentAppId) {
            const app = PHONE_APPS[this.currentAppId];
            app.render(document.getElementById('app-content'));
        }
    },

    updateTime: function() {
        let d = new Date();
        let timeStr = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
        document.getElementById("status-time").innerText = timeStr;
        document.getElementById("widget-time").innerText = timeStr;
    }
};

window.onload = () => {
    PhoneEngine.init();
};
</script>
