<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ashveil Phone</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

height:100vh;

background:#05060b;

display:flex;

justify-content:center;

align-items:center;

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

color:white;

}



.phone{

width:390px;

height:820px;

max-height:100vh;

background:#10131d;

border-radius:45px;

border:8px solid #222633;

overflow:hidden;

position:relative;

box-shadow:
0 0 40px rgba(0,0,0,.8);

}




/* 状态栏 */


.status{

height:35px;

padding:10px 22px;

display:flex;

justify-content:space-between;

font-size:13px;

color:#ddd;

}




/* 页面 */

.page{

height:calc(100% - 35px);

display:none;

flex-direction:column;

}



.page.active{

display:flex;

}




/* 桌面 */


.home{

padding:40px 25px;

background:

linear-gradient(
180deg,
#171b2b,
#090b12
);

}



.wall-title{

text-align:center;

font-size:22px;

margin-bottom:45px;

letter-spacing:2px;

}



.apps{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:35px;

}



.app-icon{

text-align:center;

cursor:pointer;

}



.icon{

width:70px;

height:70px;

margin:auto;

border-radius:20px;

background:#252b40;

display:flex;

align-items:center;

justify-content:center;

font-size:32px;

}



.app-name{

margin-top:10px;

font-size:14px;

color:#ddd;

}




/* app顶部 */


.header{

height:60px;

display:flex;

align-items:center;

padding:0 18px;

background:#151927;

border-bottom:1px solid #303548;

}



.back{

font-size:26px;

margin-right:15px;

cursor:pointer;

}



.title{

font-size:18px;

font-weight:bold;

}




/* 内容 */

.content{

padding:20px;

overflow:auto;

line-height:1.7;

}



.card{

background:#202638;

border-radius:15px;

padding:18px;

margin-bottom:15px;

}



</style>

</head>


<body>



<div class="phone">



<div class="status">

<span id="time">

02:44

</span>

<span>

◉ WiFi 🔋

</span>

</div>



<!-- 桌面 -->


<div class="page home active" id="home">


<div class="wall-title">

Ashveil

</div>



<div class="apps">


<div class="app-icon" onclick="openApp('chat')">

<div class="icon">

💬

</div>

<div class="app-name">

聊天

</div>

</div>



<div class="app-icon" onclick="openApp('memory')">

<div class="icon">

📖

</div>

<div class="app-name">

回忆

</div>

</div>



<div class="app-icon" onclick="openApp('case')">

<div class="icon">

🕵

</div>

<div class="app-name">

案件

</div>

</div>



<div class="app-icon" onclick="openApp('setting')">

<div class="icon">

⚙️

</div>

<div class="app-name">

设置

</div>

</div>



</div>


</div>
<!-- 聊天 App -->

<div class="page" id="chat">


<div class="header">

<div class="back" onclick="goHome()">

←

</div>

<div class="title">

💬 与不死途聊天

</div>

</div>



<div class="content" id="chatBox">


<div class="card">

🎩 不死途：

<br>

来了？

<br>

欢迎回到事务所。

</div>


</div>


</div>





<!-- 回忆 App -->


<div class="page" id="memory">


<div class="header">


<div class="back" onclick="goHome()">

←

</div>


<div class="title">

📖 回忆录

</div>


</div>



<div class="content">


<div class="card">


旧日记录

<br><br>


“有些人离开以后，

名字不能跟着一起消失。”


<br><br>


—— 不死途


</div>



<div class="card">


鸽川区档案

<br><br>


未知时间。

<br>

未知地点。

<br>

留下了一块旧怀表。

</div>



</div>


</div>







<!-- 案件 App -->


<div class="page" id="case">


<div class="header">


<div class="back" onclick="goHome()">

←

</div>


<div class="title">

🕵 案件簿

</div>


</div>



<div class="content">



<div class="card">


当前委托：

<br><br>


◆ 寻找失踪物品

<br>

状态：

调查中


</div>



<div class="card">


危险档案：

<br><br>


原始博士相关线索

<br>

等级：

未知


</div>


</div>



</div>








<!-- 设置 -->


<div class="page" id="setting">


<div class="header">


<div class="back" onclick="goHome()">

←

</div>


<div class="title">

⚙ 设置

</div>


</div>



<div class="content">


<div class="card">

角色：

<br>

不死途 Ashveil

</div>



<div class="card">

版本：

<br>

Private Phone v1.0

</div>



</div>


</div>




</div>




<script>


// 时间

function updateTime(){

let d=new Date();


document.getElementById("time").innerText=

d.getHours()
+
":"
+
String(d.getMinutes()).padStart(2,"0");

}


setInterval(updateTime,1000);

updateTime();





// 打开 App


function openApp(id){


document
.querySelectorAll(".page")
.forEach(p=>{

p.classList.remove("active");

});


document
.getElementById(id)
.classList.add("active");


}




// 返回桌面


function goHome(){


document
.querySelectorAll(".page")
.forEach(p=>{

p.classList.remove("active");

});


document
.getElementById("home")
.classList.add("active");


}





</script>



</body>

</html>
