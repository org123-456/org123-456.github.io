<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>不死神探事务所</title>

<style>

body {
    margin:0;
    background:#08090d;
    color:white;
    font-family:sans-serif;
}

.app {
    max-width:500px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
}

.header {
    padding:20px;
    text-align:center;
    background:#151722;
    border-bottom:1px solid #333;
}

.header h1 {
    color:#d8c2ff;
    margin:0;
}

.chat {
    flex:1;
    padding:20px;
    overflow:auto;
}

.msg {
    padding:12px 16px;
    margin:12px 0;
    border-radius:15px;
    max-width:80%;
    line-height:1.5;
}

.detective {
    background:#252838;
}

.user {
    background:#59458a;
    margin-left:auto;
}

.input {
    display:flex;
    padding:15px;
    background:#151722;
}

input {
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    background:#222532;
    color:white;
}

button {
    margin-left:10px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#c8a7ff;
}

</style>

</head>


<body>

<div class="app">


<div class="header">
<h1>不死神探事务所</h1>
</div>


<div class="chat" id="chat">

<div class="msg detective">
【不死神探】<br>
欢迎来到调查现场。<br>
说出你的委托。
</div>

</div>


<div class="input">

<input id="text" placeholder="输入你的案件……">

<button onclick="send()">
发送
</button>

</div>


</div>



<script>

function send(){

let input=document.getElementById("text");
let chat=document.getElementById("chat");

if(input.value.trim()=="") return;


chat.innerHTML += 
`
<div class="msg user">
${input.value}
</div>
`;


setTimeout(()=>{

chat.innerHTML +=
`
<div class="msg detective">
【不死神探】<br>
案件已记录。<br>
让我看看现场留下了什么线索……
</div>
`;

chat.scrollTop=chat.scrollHeight;

},600);


input.value="";

}

</script>


</body>
</html>
