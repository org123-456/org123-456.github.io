<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>不死途 · Ashveil</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

height:100vh;

background:#070812;

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

color:white;

display:flex;

justify-content:center;

}



.phone{

width:100%;

max-width:430px;

height:100vh;

background:
linear-gradient(
180deg,
#111522,
#080912
);

display:flex;

flex-direction:column;

overflow:hidden;

}



/* 手机状态栏 */

.status{

height:28px;

padding:6px 15px;

font-size:12px;

display:flex;

justify-content:space-between;

color:#aaa;

}




/* 顶部 */

.header{

height:72px;

display:flex;

align-items:center;

padding:10px 18px;

border-bottom:1px solid #272b3b;

background:#121522;

}


.back{

font-size:26px;

margin-right:15px;

color:#ccc;

}



.avatar{

width:48px;

height:48px;

border-radius:50%;

background:

linear-gradient(
135deg,
#eee6ff,
#5d496d
);

display:flex;

align-items:center;

justify-content:center;

font-size:24px;

margin-right:12px;

}



.name{

font-size:18px;

font-weight:600;

}


.online{

font-size:12px;

color:#8bd17c;

margin-top:4px;

}



/* 聊天 */

.chat{

flex:1;

overflow-y:auto;

padding:20px 16px;

}



.message{

display:flex;

margin-bottom:18px;

align-items:flex-start;

}


.message.me{

justify-content:flex-end;

}



.msg-avatar{

width:34px;

height:34px;

border-radius:50%;

background:#4b405f;

display:flex;

align-items:center;

justify-content:center;

font-size:16px;

margin-right:10px;

}


.me .msg-avatar{

display:none;

}



.content{

max-width:72%;

}



.sender{

font-size:12px;

color:#999;

margin-bottom:5px;

}


.bubble{

padding:12px 15px;

border-radius:16px;

line-height:1.5;

font-size:15px;

background:#23283a;

}



.me .bubble{

background:#725da3;

border-bottom-right-radius:4px;

}



.other .bubble{

border-bottom-left-radius:4px;

}



/* 输入 */

.input-box{

height:70px;

padding:12px;

display:flex;

align-items:center;

background:#121522;

border-top:1px solid #272b3b;

}



.input-box input{

flex:1;

height:42px;

border-radius:22px;

border:none;

outline:none;

background:#222738;

color:white;

padding:0 18px;

font-size:15px;

}


.send{

width:48px;

height:42px;

margin-left:10px;

border-radius:22px;

border:none;

background:#cbb7ff;

color:#20172c;

}



</style>

</head>


<body>


<div class="phone">


<div class="status">

<span>02:36</span>

<span>◉  WiFi  🔋</span>

</div>



<div class="header">


<div class="back">

←

</div>


<div class="avatar">

🎩

</div>


<div>

<div class="name">

不死途

</div>

<div class="online">

● 在线

</div>

</div>


</div>



<div class="chat" id="chat">


<div class="message other">


<div class="msg-avatar">

🎩

</div>


<div class="content">


<div class="sender">

不死途

</div>


<div class="bubble">

来了？

<br>

今天怎么样。

</div>


</div>


</div>



</div>


<div class="input-box">


<input id="input" placeholder="输入消息……">


<button class="send" onclick="send()">

发

</button>


</div>



</div>
<script>


const chat = document.getElementById("chat");

const input = document.getElementById("input");



let replies=[

"嗯。来了就坐吧。",

"我在听。慢慢说。",

"今天看起来不太顺利。",

"别急，把事情一件件说。",

"鸽川区今晚很安静，适合聊天。",

"你不是只是来打招呼的，对吧？"

];




// 添加消息

function addMessage(text,type){


let box=document.createElement("div");


box.className=
"message "+type;



if(type==="other"){


box.innerHTML=

`

<div class="msg-avatar">
🎩
</div>

<div class="content">

<div class="sender">
不死途
</div>

<div class="bubble">
${text}
</div>

</div>

`;



}else{


box.innerHTML=

`

<div class="content">

<div class="sender">
你
</div>

<div class="bubble">
${text}
</div>

</div>

`;

}


chat.appendChild(box);


chat.scrollTop=chat.scrollHeight;


}




// 发送

function send(){


let text=input.value.trim();


if(!text){

return;

}



addMessage(
text,
"me"
);


input.value="";




// 输入状态

let typing=document.createElement("div");


typing.className=
"message other";


typing.innerHTML=

`

<div class="msg-avatar">
🎩
</div>

<div class="content">

<div class="sender">
不死途
</div>

<div class="bubble">
<span id="dots">
正在输入
</span>
</div>

</div>

`;


chat.appendChild(typing);


chat.scrollTop=chat.scrollHeight;




setTimeout(()=>{


typing.remove();



addMessage(
getReply(text),
"other"
);


save();


},1200);



}




// 简单人格回复

function getReply(text){



if(
text.includes("累")||
text.includes("烦")||
text.includes("难过")
){

return "嗯……听起来今天消耗了很多。先不用急着解决所有事情，告诉我发生什么了。";

}



if(
text.includes("你好")||
text.includes("在吗")
){

return "在。怎么，终于想起来找我了？";

}



if(
text.includes("想你")
){

return "想我？这个委托我暂时不会收费。";

}



if(
text.includes("案件")||
text.includes("调查")
){

return "好，案件模式开启。把线索给我，时间、地点、人物，一个都别漏。";

}



return replies[
Math.floor(
Math.random()*replies.length
)
];


}




// 保存

function save(){


localStorage.setItem(
"ashveil",
chat.innerHTML
);


}



// 加载

window.onload=function(){


let old=
localStorage.getItem(
"ashveil"
);



if(old){

chat.innerHTML=old;

}


};




// 回车发送

input.addEventListener(
"keydown",
function(e){


if(e.key==="Enter"){

send();

}


});



</script>


</body>

</html>
